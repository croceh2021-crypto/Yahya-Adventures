
name: Build Yahya Adventures APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Check Godot and Android setup
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/project" \
            -w /project \
            barichello/godot-ci:4.4.1 \
            bash -c '
              echo "===== GODOT VERSION ====="
              godot --version

              echo "===== JAVA VERSION ====="
              java -version

              echo "===== ANDROID SDK ====="
              echo "$ANDROID_HOME"
              ls "$ANDROID_HOME/build-tools"

              echo "===== EXPORT TEMPLATES ====="
              ls -la ~/.local/share/godot/export_templates/4.4.stable/

              echo "===== PROJECT IMPORT ====="
              godot --headless --editor --path . --quit --verbose
            '

      - name: Export Android APK
        run: |
          mkdir -p build
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/project" \
            -w /project \
            barichello/godot-ci:4.4.1 \
            godot --headless --verbose --path . \
            --export-debug "Android" build/YahyaAdventures.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Yahya-Adventures-APK
          path: build/YahyaAdventures.apk
