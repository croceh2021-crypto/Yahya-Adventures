
name: Build Yahya Adventures APK

on:
  push:
    branches:
      - main
      - yahya-3d-preview-test
      - fix/mobile-controls-main-scene-2026-11-25
      - feature/100-realistic-3d-world-upgrades

  pull_request:
    branches:
      - main

  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Download Godot Export Templates
        run: |
          curl -fL --retry 3 \
            "https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_export_templates.tpz" \
            -o "$RUNNER_TEMP/templates.tpz"
          test -s "$RUNNER_TEMP/templates.tpz"

      - name: Configure Android and export APK
        run: |
          mkdir -p build

          docker run --rm \
            -v "$GITHUB_WORKSPACE:/project" \
            -v "$RUNNER_TEMP/templates.tpz:/tmp/templates.tpz:ro" \
            -w /project \
            barichello/godot-ci:4.4.1 \
            bash -c '
              set -eux

              export JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64
              export ANDROID_HOME=/usr/lib/android-sdk
              export ANDROID_SDK_ROOT=/usr/lib/android-sdk

              export GODOT_ANDROID_KEYSTORE_DEBUG_PATH=/root/debug.keystore
              export GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey
              export GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android

              test -x "$JAVA_HOME/bin/java"
              test -x "$ANDROID_HOME/platform-tools/adb"
              test -s /root/debug.keystore

              echo "Checking debug keystore alias"
              keytool -list \
                -keystore /root/debug.keystore \
                -storepass android \
                -alias androiddebugkey

              SDKMANAGER=$(find /usr/lib/android-sdk -name sdkmanager -type f | head -n 1)
              test -n "$SDKMANAGER"
              chmod +x "$SDKMANAGER"

              yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses || true

              yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" \
                "platform-tools" \
                "build-tools;34.0.0" \
                "platforms;android-34" \
                "cmdline-tools;latest" \
                "cmake;3.10.2.4988404" \
                "ndk;23.2.8568313"

              echo "Installing Godot templates"
              mkdir -p /tmp/templates
              unzip -q /tmp/templates.tpz -d /tmp/templates

              SOURCE=$(find /tmp/templates -name android_debug.apk -printf "%h\n" | head -n 1)
              test -n "$SOURCE"

              DEST=/root/.local/share/godot/export_templates/4.4.1.stable
              mkdir -p "$DEST"
              cp -a "$SOURCE/." "$DEST/"

              mkdir -p /root/.android
              cp /root/debug.keystore /root/.android/debug.keystore

              echo "Rebuilding Godot editor settings"
              rm -f /root/.config/godot/editor_settings-4.4.tres

              godot --headless --editor --path . --quit

              echo "Checking Android SDK settings"
              grep -E "java_sdk_path|android_sdk_path" \
                /root/.config/godot/editor_settings-4.4.tres

              echo "Exporting APK"
              godot --headless --verbose --path . \
                --export-debug "Android" build/YahyaAdventures.apk

              test -s build/YahyaAdventures.apk
              ls -lh build/YahyaAdventures.apk
            '

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Yahya-Adventures-APK
          path: build/YahyaAdventures.apk
          if-no-files-found: error
