
name: Build Yahya Adventures APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Import Godot project
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/project" \
            -w /project \
            barichello/godot-ci:4.4.1 \
            godot --headless --editor --path . --quit

      - name: Install Godot Export Templates and Export APK
        run: |
          mkdir -p build

          docker run --rm \
            -v "$GITHUB_WORKSPACE:/project" \
            -w /project \
            barichello/godot-ci:4.4.1 \
            bash -c '
              set -e

              echo "===== DOWNLOAD GODOT 4.4.1 TEMPLATES ====="

              mkdir -p /tmp/godot-templates
              curl -fL \
                "https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_export_templates.tpz" \
                -o /tmp/godot-templates/templates.tpz

              echo "===== EXTRACT TEMPLATES ====="

              unzip -q /tmp/godot-templates/templates.tpz \
                -d /tmp/godot-templates/extracted

              TEMPLATE_SOURCE=$(find /tmp/godot-templates/extracted \
                -name android_debug.apk -printf "%h\n" | head -n 1)

              if [ -z "$TEMPLATE_SOURCE" ]; then
                echo "ERROR: Android export templates not found"
                exit 1
              fi

              DEST="$HOME/.local/share/godot/export_templates/4.4.1.stable"
              mkdir -p "$DEST"
              cp -a "$TEMPLATE_SOURCE/." "$DEST/"

              echo "===== VERIFY TEMPLATES ====="
              ls -lh "$DEST/android_debug.apk"
              ls -lh "$DEST/android_release.apk"

              echo "===== EXPORT APK ====="

              godot --headless --verbose --path . \
                --export-debug "Android" build/YahyaAdventures.apk

              test -s build/YahyaAdventures.apk
            '

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Yahya-Adventures-APK
          path: build/YahyaAdventures.apk
