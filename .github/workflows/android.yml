
name: Build Yahya Adventures APK

on:
  push:
    branches:
      - main
      - yahya-3d-preview-test
      - fix/mobile-controls-main-scene-2026-11-25
      - feature/100-realistic-3d-world-upgrades

  pull_request:
    branches:
      - main

  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Download Godot Export Templates
        run: |
          curl -fL --retry 3 \
            "https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_export_templates.tpz" \
            -o "$RUNNER_TEMP/templates.tpz"
          test -s "$RUNNER_TEMP/templates.tpz"

      - name: Configure Android and export APK
        run: |
          mkdir -p build

          timeout 20m docker run --rm \
            -v "$GITHUB_WORKSPACE:/project" \
            -v "$RUNNER_TEMP/templates.tpz:/tmp/templates.tpz:ro" \
            -w /project \
            barichello/godot-ci:4.4.1 \
            bash -c '
              set -eux

              export JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64
              export ANDROID_HOME=/usr/lib/android-sdk
              export ANDROID_SDK_ROOT=/usr/lib/android-sdk

              export GODOT_ANDROID_KEYSTORE_DEBUG_PATH=/root/debug.keystore
              export GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey
              export GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android

              test -x "$JAVA_HOME/bin/java"
              test -x "$ANDROID_HOME/platform-tools/adb"
              test -s /root/debug.keystore

              echo "Checking debug keystore alias"
              keytool -list \
                -keystore /root/debug.keystore \
                -storepass android \
                -alias androiddebugkey

              SDKMANAGER=$(find /usr/lib/android-sdk -name sdkmanager -type f | head -n 1)
              test -n "$SDKMANAGER"
              chmod +x "$SDKMANAGER"

              yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses || true

              yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" \
                "platform-tools" \
                "build-tools;34.0.0" \
                "platforms;android-34" \
                "cmdline-tools;latest" \
                "cmake;3.10.2.4988404" \
                "ndk;23.2.8568313"

              echo "Installing Godot templates"
              mkdir -p /tmp/templates
              unzip -q /tmp/templates.tpz -d /tmp/templates

              SOURCE=$(find /tmp/templates -name android_debug.apk -printf "%h\n" | head -n 1)
              test -n "$SOURCE"

              DEST=/root/.local/share/godot/export_templates/4.4.1.stable
              mkdir -p "$DEST"
              cp -a "$SOURCE/." "$DEST/"

              mkdir -p /root/.android
              cp /root/debug.keystore /root/.android/debug.keystore

              echo "Rebuilding Godot editor settings"
              rm -f /root/.config/godot/editor_settings-4.4.tres

              godot --headless --editor --path . --quit

              echo "Checking Android SDK settings"
              grep -E "java_sdk_path|android_sdk_path" \
                /root/.config/godot/editor_settings-4.4.tres

              echo "Exporting APK"
              godot --headless --verbose --path . \
                --export-debug "Android" build/YahyaAdventures.apk

              test -s build/YahyaAdventures.apk
              ls -lh build/YahyaAdventures.apk
            '

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Yahya-Adventures-APK
          path: build/YahyaAdventures.apk
          if-no-files-found: error


  android-emulator-smoke:
    name: Run APK in Android Emulator
    runs-on: ubuntu-latest
    needs: build-android
    timeout-minutes: 25
    steps:
      - name: Select emulator acceleration
        shell: bash
        run: |
          if [[ -e /dev/kvm && -r /dev/kvm && -w /dev/kvm ]]; then
            echo "KVM is available; the emulator can use hardware acceleration."
          else
            echo "KVM is unavailable; enabling the emulator's software TCG fallback."
            echo "ANDROID_I_WANT_MY_TCG=yes" >> "$GITHUB_ENV"
          fi

      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: Yahya-Adventures-APK
          path: build

      - name: Verify APK artifact
        run: |
          test -s build/YahyaAdventures.apk
          ls -lh build/YahyaAdventures.apk

      - name: Install, launch, and exercise game
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -no-metrics
          disable-animations: true
          script: |
            set -euo pipefail
            mkdir -p test-results

            adb_retry() {
              local attempt
              for attempt in 1 2 3; do
                if adb "$@"; then
                  return 0
                fi
                echo "ADB command failed (attempt $attempt/3): $*"
                adb reconnect offline || true
                adb start-server || true
                sleep 3
              done
              echo "ADB command failed after 3 attempts: $*" >&2
              return 1
            }

            echo "Waiting for Android device"
            timeout 120s adb wait-for-device
            for attempt in $(seq 1 30); do
              boot_state="$(adb_retry shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)"
              if [[ "$boot_state" == "1" ]]; then
                break
              fi
              sleep 2
            done
            [[ "$boot_state" == "1" ]] || { echo "Android did not finish booting"; exit 1; }

            echo "Applying lightweight test display settings"
            adb_retry shell wm size 854x480
            adb_retry logcat -c

            echo "Installing APK with automatic ADB recovery"
            adb_retry install -r build/YahyaAdventures.apk

            echo "Launching game"
            adb_retry shell monkey -p com.yahya.adventures 1
            echo "Waiting for the game process (maximum 30 seconds)"
            game_pid=""
            for attempt in $(seq 1 15); do
              game_pid="$(adb_retry shell pidof com.yahya.adventures 2>/dev/null | tr -d '\r' || true)"
              if [[ -n "$game_pid" ]]; then
                break
              fi
              sleep 2
            done
            [[ -n "$game_pid" ]] || { echo "Game process did not start"; exit 1; }

            echo "Checking that the game process is still running"
            sleep 5
            adb_retry shell pidof com.yahya.adventures

            echo "Capturing initial game screen"
            adb_retry exec-out screencap -p > test-results/game-start.png
            test -s test-results/game-start.png

            echo "Sending basic touch input at common gameplay areas"
            adb_retry shell input tap 80 400
            sleep 1
            adb_retry shell input tap 780 400
            sleep 1
            adb_retry shell input tap 427 240
            sleep 2

            echo "Capturing screen after touch input"
            adb_retry exec-out screencap -p > test-results/game-after-input.png
            test -s test-results/game-after-input.png

            echo "Collecting Android logs"
            adb_retry logcat -d -v time > test-results/logcat.txt

            if grep -E -i "FATAL EXCEPTION|Fatal signal|SIGSEGV|Process com\\.yahya\\.adventures.*(died|has died)" test-results/logcat.txt; then
              echo "A fatal Android/app error was found in logcat"
              exit 1
            fi

            echo "Game remained running after launch and basic touch input"

      - name: Upload emulator test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Yahya-Adventures-Emulator-Test
          path: test-results/
          if-no-files-found: warn
