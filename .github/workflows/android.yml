
name: Build Yahya Adventures APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Import Godot project
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/project" \
            -w /project \
            barichello/godot-ci:4.4.1 \
            godot --headless --editor --path . --quit

      - name: Download Godot Export Templates
        run: |
          curl -fL --retry 3 \
            "https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_export_templates.tpz" \
            -o "$RUNNER_TEMP/godot-4.4.1-templates.tpz"
          test -s "$RUNNER_TEMP/godot-4.4.1-templates.tpz"

      - name: Configure Android and Export APK
        run: |
          mkdir -p build

          docker run --rm \
            -v "$GITHUB_WORKSPACE:/project" \
            -v "$RUNNER_TEMP/godot-4.4.1-templates.tpz:/tmp/godot-templates.tpz:ro" \
            -w /project \
            barichello/godot-ci:4.4.1 \
            bash -c '
              set -eux

              export ANDROID_HOME=/usr/lib/android-sdk
              export JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64
              export PATH="$JAVA_HOME/bin:$ANDROID_HOME/platform-tools:$ANDROID_HOME/cmdline-tools/cmdline-tools/bin:$PATH"

              test -x "$JAVA_HOME/bin/java"
              test -x "$ANDROID_HOME/platform-tools/adb"
              test -d "$ANDROID_HOME/platforms/android-33"
              test -d "$ANDROID_HOME/build-tools/33.0.2"
              test -s "$HOME/debug.keystore"

              mkdir -p "$HOME/.config/godot"
              cat > "$HOME/.config/godot/editor_settings-4.4.tres" <<EOF
[gd_resource type="EditorSettings" format=3]

[resource]
export/android/java_sdk_path = "$JAVA_HOME"
export/android/android_sdk_path = "$ANDROID_HOME"
export/android/debug_keystore = "$HOME/debug.keystore"
export/android/debug_keystore_user = "androiddebugkey"
export/android/debug_keystore_pass = "android"
EOF

              mkdir -p /tmp/godot-templates/extracted
              unzip -q /tmp/godot-templates.tpz -d /tmp/godot-templates/extracted

              TEMPLATE_SOURCE=$(find /tmp/godot-templates/extracted \
                -name android_debug.apk -printf "%h\n" | head -n 1)

              if [ -z "$TEMPLATE_SOURCE" ]; then
                echo "ERROR: Android export templates not found"
                exit 1
              fi

              DEST="$HOME/.local/share/godot/export_templates/4.4.1.stable"
              mkdir -p "$DEST"
              cp -a "$TEMPLATE_SOURCE/." "$DEST/"

              test -s "$DEST/android_debug.apk"
              test -s "$DEST/android_release.apk"

              java -version
              echo "ANDROID_HOME=$ANDROID_HOME"
              echo "JAVA_HOME=$JAVA_HOME"

              godot --headless --editor --path . --quit

              godot --headless --verbose --path . \
                --export-debug "Android" build/YahyaAdventures.apk

              test -s build/YahyaAdventures.apk
              ls -lh build/YahyaAdventures.apk
            '

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Yahya-Adventures-APK
          path: build/YahyaAdventures.apk
          if-no-files-found: error
