
name: Build Yahya Adventures APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Import Godot project
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/project" \
            -w /project \
            barichello/godot-ci:4.4.1 \
            godot --headless --editor --path . --quit

      - name: Download Godot Export Templates
        run: |
          curl -fL --retry 3 \
            "https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_export_templates.tpz" \
            -o "$RUNNER_TEMP/templates.tpz"
          test -s "$RUNNER_TEMP/templates.tpz"

      - name: Install templates and export APK
        run: |
          mkdir -p build

          docker run --rm \
            -v "$GITHUB_WORKSPACE:/project" \
            -v "$RUNNER_TEMP/templates.tpz:/tmp/templates.tpz:ro" \
            -w /project \
            barichello/godot-ci:4.4.1 \
            bash -c '
              set -eux

              echo "Checking Android environment"
              test -x /usr/lib/jvm/java-17-openjdk-amd64/bin/java
              test -x /usr/lib/android-sdk/platform-tools/adb
              test -s /root/debug.keystore
              test -s /root/.config/godot/editor_settings-4.4.tres

              mkdir -p /tmp/templates
              unzip -q /tmp/templates.tpz -d /tmp/templates

              SOURCE=$(find /tmp/templates \
                -name android_debug.apk -printf "%h\n" | head -n 1)

              test -n "$SOURCE"

              DEST=/root/.local/share/godot/export_templates/4.4.1.stable
              mkdir -p "$DEST"
              cp -a "$SOURCE/." "$DEST/"

              test -s "$DEST/android_debug.apk"
              test -s "$DEST/android_release.apk"

              godot --headless --editor --path . --quit

              godot --headless --verbose --path . \
                --export-debug "Android" build/YahyaAdventures.apk

              test -s build/YahyaAdventures.apk
              ls -lh build/YahyaAdventures.apk
            '

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Yahya-Adventures-APK
          path: build/YahyaAdventures.apk
          if-no-files-found: error
